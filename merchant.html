<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>" />
<title>Monsoon Merchants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a trading-desk screen. Ticker header, sea-chart map on the left, the selected store's shelves in the middle, the bank / rivals / newswire on the right. */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --sunk:#E2EAE6; --ink:#10282B; --muted:#56696A; --line:#C9D6D1;
  --accent:#C2372B; --accent-ink:#FFFFFF; --gold:#A87508; --jade:#1D7657; --warn:#B4540A; --sea:#DCE8E6; --grid:#BFD2CF;
  --c1:#C2372B; --c2:#A87508; --c3:#2563A8; --c4:#7A3E9D;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1618; --surface:#132225; --sunk:#0F1C1F; --ink:#E4EEEB; --muted:#8CA3A1; --line:#26393C;
  --accent:#FF6A56; --accent-ink:#1A0B08; --gold:#E2B342; --jade:#4BC498; --warn:#F09A4A; --sea:#10272B; --grid:#1F3A3E;
  --c1:#FF6A56; --c2:#E2B342; --c3:#6AA7EE; --c4:#C58AE6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1618; --surface:#132225; --sunk:#0F1C1F; --ink:#E4EEEB; --muted:#8CA3A1; --line:#26393C;
  --accent:#FF6A56; --accent-ink:#1A0B08; --gold:#E2B342; --jade:#4BC498; --warn:#F09A4A; --sea:#10272B; --grid:#1F3A3E;
  --c1:#FF6A56; --c2:#E2B342; --c3:#6AA7EE; --c4:#C58AE6; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}

/* ticker header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;flex:1}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .label{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.stat b{font-family:var(--mono);font-weight:600;font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 8px;font-size:12px}
.top .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.endbtn{font-family:var(--display);font-size:13px;padding:10px 16px;letter-spacing:.01em}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.35fr) minmax(280px,.9fr);gap:18px;padding-block:18px 40px}
.grid>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.col{display:flex;flex-direction:column;gap:18px}
.panel h2{font-size:14px;margin-bottom:10px}

/* map */
.map svg{width:100%;height:auto;display:block;border-radius:8px;background:var(--sea)}
.map .gl{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4}
.map .gt{fill:var(--muted);font:10px var(--mono)}
.map .lane{stroke:var(--grid);stroke-width:1.5;fill:none}
.pin{cursor:pointer}
.pin .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.pin .ring{fill:none;stroke-width:2;opacity:0}
.pin.sel .ring{opacity:.5}
.pin text{fill:var(--ink);font:600 12px var(--body)}
.pin .evt{fill:var(--warn);font:700 11px var(--mono)}
.citylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}
.cityb{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 8px;text-align:left;font-size:13px}
.cityb.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.owners{display:flex;gap:3px}
.owners span{width:8px;height:8px;border-radius:50%}

/* store */
.cityhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.cityhead h2{font-size:22px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;color:var(--muted);font-size:13px}
.facts b{color:var(--ink);font-family:var(--mono);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--sunk)}
.chip.good{color:var(--jade);border-color:color-mix(in srgb,var(--jade) 45%,transparent)}
.chip.bad{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.storebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:16px 0 12px;padding:10px 12px;background:var(--sunk);border-radius:8px}
.storebar .lvl{font-family:var(--display);font-size:14px}
.storebar label{display:flex;align-items:center;gap:6px;font-size:13px}
select,input[type=number]{font:inherit;font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 6px}
input[type=number]{width:92px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,.8fr) minmax(0,1.3fr) minmax(0,.6fr);gap:10px 14px;align-items:end}
.slot .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.slot .f select{width:100%}
.slot .row2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.slot .row2 b{color:var(--ink);font-family:var(--mono);font-weight:500}
.inline{display:flex;gap:4px;align-items:center;min-width:0}
.slot .f input[type=number]{width:100%;min-width:0}
.inline .btn{flex:none}
.warn{color:var(--warn)}
.good{color:var(--jade)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted)}
.openbox{margin-top:16px;padding:16px;border:1px dashed var(--accent);border-radius:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.orderline{margin-top:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.orderline b{color:var(--ink);font-family:var(--mono)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.intel{margin-top:18px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:44px}
.bar i{display:block;height:100%;background:var(--jade)}

/* side */
.lb{display:flex;flex-direction:column;gap:8px}
.lbrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:0}
.lbrow .sw{width:10px;height:10px;border-radius:2px}
.lbrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .nw{font-family:var(--mono);font-weight:600}
.lbrow .sub{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.progress{height:4px;background:var(--sunk);border-radius:2px;grid-column:2/-1;overflow:hidden}
.progress i{display:block;height:100%}
.bankgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv{background:var(--sunk);border-radius:6px;padding:8px 10px}
.kv b{display:block;font-family:var(--mono);font-size:15px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.news{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.news li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;font-size:13px}
.news .tag{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);align-self:start;text-align:center}
.news .tag.fest{color:var(--jade)} .news .tag.alert{color:var(--warn)} .news .tag.bank{color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:12px}
details summary{cursor:pointer;font-weight:600}

/* overlay */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:860px;width:100%;padding:24px;border:1px solid var(--line)}
.modal h1{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.modal h1 em{font-style:normal;color:var(--accent)}
.modal .lede{max-width:62ch;color:var(--muted);margin:10px 0 18px;font-size:15px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pick{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pick:hover{border-color:var(--accent)}
.pick .nm{font-family:var(--display);font-size:14px}
.pick .sw{width:28px;height:4px;border-radius:2px}
.howto{margin-top:18px;font-size:13px;color:var(--muted)}
.howto ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.repsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}


/* per-city identity: each city tints its own store page */
:root{ --city-SG:#C8203A; --city-HK:#A82C68; --city-SH:#8F6A00; --city-TK:#3646A6; --city-SE:#13639F; --city-BK:#B5500B; --city-JK:#14764A; --city-MB:#6838B0; --city:var(--accent) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --city-SG:#FF6B7A; --city-HK:#F07AB4; --city-SH:#E8BE45; --city-TK:#8C9EFF; --city-SE:#6CB8F0; --city-BK:#FF9D52; --city-JK:#4CD08E; --city-MB:#B796F2 }}
:root[data-theme="dark"]{ --city-SG:#FF6B7A; --city-HK:#F07AB4; --city-SH:#E8BE45; --city-TK:#8C9EFF; --city-SE:#6CB8F0; --city-BK:#FF9D52; --city-JK:#4CD08E; --city-MB:#B796F2 }
#store{--accent:var(--city);border-top:6px solid var(--city);background:linear-gradient(to bottom,color-mix(in srgb,var(--city) 11%,var(--surface)),var(--surface) 190px)}
.cityband{display:flex;gap:14px;align-items:center}
.flag{display:block;flex:none;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.cityband .flag{width:60px;height:40px}
.cityhead h2{color:var(--city)}
.nick{font-size:13px;color:var(--city);font-weight:600;margin-top:2px}
#store .storebar{background:color-mix(in srgb,var(--city) 9%,var(--sunk))}
#store .slot{border-left:3px solid color-mix(in srgb,var(--city) 55%,var(--line))}
.cityb{border-left:4px solid var(--cityc)}
.cityb .cn{display:flex;align-items:center;gap:7px;min-width:0}
.cityb .flag{width:21px;height:14px}
.cityb.sel{border-color:var(--cityc);box-shadow:none;background:color-mix(in srgb,var(--cityc) 14%,var(--surface));font-weight:600}
.pin.sel .dot{fill:var(--cityc);stroke:var(--cityc)}
.pin .ring{stroke:var(--cityc)}
.favs{margin-top:12px}
.favlist{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.favlist li{display:flex;align-items:center;gap:9px;min-width:0;padding:8px 10px 7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.favlist .rank{position:absolute;top:-7px;left:-7px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);background:var(--city);color:var(--surface)}
.favlist li:nth-child(n+2) .rank{background:var(--surface);color:var(--city);box-shadow:inset 0 0 0 1.5px var(--city)}
.favlist .pico{position:relative;width:34px;height:34px}.favlist .pico svg{width:24px;height:24px}
.favtx{display:flex;flex-direction:column;min-width:0}
.favtx b{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
@media (max-width:560px){ .favlist{grid-template-columns:minmax(0,1fr)} }
.chips:empty{display:none}
/* product icons */
.pico{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.pico svg{width:28px;height:28px}
.pico.empty-ico{border-style:dashed;color:var(--muted);font-size:18px}
.prodpick{display:flex;gap:8px;align-items:center;min-width:0}
.prodpick select{flex:1;min-width:0}
td:first-child{white-space:nowrap}
.tico{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:6px}

/* multiplayer */
:root{ --hdr-warn:#FFB25B } @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --hdr-warn:#9A4A00 }} :root[data-theme="dark"]{ --hdr-warn:#9A4A00 }
@media (max-width:1420px){ .top .wrap:has(.netbar:not([hidden])) .stat.goal{display:none} }
.netbar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px}
.netbar .room{padding:3px 8px;border-radius:5px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);letter-spacing:.14em}
.netbar .tmr{font-size:17px;font-weight:600;min-width:3.2em}
.netbar .tmr.low,.netbar .lostdot{color:var(--hdr-warn)}
.endbtn.isready{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.roomcode{font-family:var(--mono);letter-spacing:.14em;color:var(--accent)}
.seats{display:flex;flex-direction:column}
.seat{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seat:last-child{border-bottom:0}
.seat .sw{width:10px;height:10px;border-radius:2px;flex:none}
.seatnm{display:flex;flex-direction:column;min-width:0;flex:1}
.lobbyhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:8px}
.codebig{font-family:var(--mono);font-size:clamp(30px,8vw,46px);letter-spacing:.2em;font-weight:600;color:var(--accent);line-height:1.1}
.pick.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick.taken,.pick:disabled{opacity:.5;cursor:not-allowed}
.pick.mine:disabled{opacity:1}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.fbox{display:flex;flex-direction:column;gap:5px;min-width:0}
.friendgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
input[type=text],.savebox{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:7px 8px;min-width:0}
.savebox{width:100%;min-height:120px;font-family:var(--mono);font-size:11px;word-break:break-all;resize:vertical}
@media (max-width:1180px){ .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)} .side{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))} }
@media (max-width:760px){ .top{position:static} .grid{grid-template-columns:minmax(0,1fr)} .slot{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .slot .f.prod{grid-column:1/-1} .stats{gap:6px 14px} .stat b{font-size:13px} }
@media (prefers-reduced-motion:no-preference){ .pin .dot{transition:fill .2s} .progress i,.bar i{transition:width .4s} }
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i>Monsoon Merchants</div>
    <div class="stats" id="stats"></div>
    <div class="netbar" id="netbar" hidden></div>
    <button class="btn ghost small" data-act="help" type="button">How to play</button>
    <button class="btn primary endbtn" data-act="end" id="endbtn" type="button">End week</button>
  </div>
</header>

<main class="wrap grid">
  <section class="col">
    <div class="panel map" id="map"></div>
  </section>
  <section class="col">
    <div class="panel" id="store"></div>
  </section>
  <aside class="col side" id="side"></aside>
</main>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
/*ENGINE START*/
const TARGET = 2000000, WEEKS = 52, SHARES = 1000000, START_CASH = 120000;
const SLOTS = [0, 2, 4, 6], LVL_NAME = ['', 'Kiosk', 'Shop', 'Megastore'], LVL_F = [0, 1, 1.15, 1.3], RENT_M = [0, 1, 1.7, 2.4];
const PRODUCTS = [
  {id:'tea',     name:'Bubble Tea',     unit:'cup',    cost:1.2, ref:4,   base:3000, spoil:.4},
  {id:'noodle',  name:'Instant Noodles',unit:'pack',   cost:.5,  ref:1.5, base:6000, spoil:0},
  {id:'durian',  name:'Durian Snacks',  unit:'box',    cost:3,   ref:8,   base:900,  spoil:.3},
  {id:'spice',   name:'Spice Blends',   unit:'jar',    cost:2,   ref:6,   base:1200, spoil:0},
  {id:'textile', name:'Batik Textiles', unit:'piece',  cost:15,  ref:45,  base:200,  spoil:0},
  {id:'beauty',  name:'K-Beauty Kits',  unit:'kit',    cost:10,  ref:28,  base:400,  spoil:0},
  {id:'anime',   name:'Anime Figures',  unit:'figure', cost:20,  ref:60,  base:150,  spoil:0},
  {id:'phone',   name:'Smartphones',    unit:'phone',  cost:250, ref:420, base:40,   spoil:0},
];
const PBY = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
//                                                             tea noodle durian spice textile beauty anime phone

const PERSONAS = [
  {label:'Discounter', price:.9,  ad:1000, reserve:25000, stockF:1.15},
  {label:'Premium',    price:1.15,ad:3500, reserve:40000, stockF:1.05},

let S = null;
const rnd = () => Math.random();
const pick = a => a[Math.floor(rnd() * a.length)];
const wkOfYear = w => ((w - 1) % 52) + 1;
const comp = id => S.companies.find(c => c.id === id);
const human = () => S.companies.find(c => c.human);

function emptySlot(){ return {p:null, stock:0, price:0, order:0, sold:0, dem:0, lost:0, spoiled:0}; }
function newStore(level, value){ return {level, ad:0, value, slots:Array.from({length:SLOTS[level]}, emptySlot), last:null, wkCogs:0}; }

function festivalsFor(city, week){ const w = wkOfYear(week); return FESTIVALS.filter(f => f.weeks.includes(w) && f.cities.includes(city)); }
function demandMult(city, pid, week = S.week){
  let m = 1;
  for (const f of festivalsFor(city, week)) m *= (f.boost[pid] || 1);
  for (const e of S.events){
    if (e.kind === 'typhoon' && e.city === city) m *= .35;
    if (e.kind === 'viral' && e.p === pid) m *= 1.8;
  }
  return m;
}
function marketDemand(city, pid, week){ const c = CBY[city], p = PBY[pid]; return p.base * c.traffic * c.taste[PRODUCTS.indexOf(p)] * demandMult(city, pid, week); }
function unitCost(pid){ let m = 1; for (const e of S.events) if (e.kind === 'shortage' && e.p === pid) m *= 1.4; return PBY[pid].cost * m; }
function shipPct(city, c){ let s = CBY[city].ship; for (const e of S.events) if (e.kind === 'strike') s *= 3; return c.perk === 'ship' ? s / 2 : s; }
function landed(city, pid, c){ return unitCost(pid) * (1 + shipPct(city, c)); }
function buildCost(c, city){ return Math.round(CBY[city].cost * (c.perk === 'build' ? .8 : 1)); }
function upgradeCost(c, city, level){ return Math.round(CBY[city].cost * (level === 1 ? 1.5 : 3) * (c.perk === 'build' ? .8 : 1)); }
function adBoost(c, st){ return .5 * (1 - Math.exp(-st.ad / 3000)) * (c.perk === 'ads' ? 1.5 : 1); }
function rentOf(city, st){ return CBY[city].rent * RENT_M[st.level]; }
function loanRate(c){ return S.rate * (c.perk === 'loan' ? .5 : 1); }
function attract(c, st, slot){ const p = PBY[slot.p]; return Math.pow(p.ref / slot.price, 2.5) * LVL_F[st.level] * (1 + adBoost(c, st)); }

function invValue(c){ let v = 0; for (const st of Object.values(c.stores)) for (const s of st.slots) if (s.p) v += s.stock * PBY[s.p].cost; return v; }
function assets(c){ let v = 0; for (const st of Object.values(c.stores)) v += st.value * .7; return v; }
function coreNW(c){ return c.cash - c.loan + assets(c) + invValue(c); }
function sharePrice(c){ return Math.max(.02, coreNW(c) / SHARES); }
function totalNW(c){ let v = coreNW(c); for (const [id, n] of Object.entries(c.shares)) v += n * sharePrice(comp(id)); return v; }
function creditLeft(c){ return Math.max(0, Math.max(60000, coreNW(c) * .6) - c.loan); }

function rivalsSelling(city, pid, me){
  const out = [];
  for (const c of S.companies){ if (c === me) continue; const st = c.stores[city]; if (!st) continue;
    for (const s of st.slots) if (s.p === pid && s.price > 0) out.push({c, st, s}); }
  return out;
}
// forecast units a given slot would sell this week at its price, given rivals' current shelves
function forecast(c, city, slot){
  if (!slot.p || !slot.price) return 0;
  const st = c.stores[city]; const a = attract(c, st, slot);
  let sum = a; for (const r of rivalsSelling(city, slot.p, c)) sum += attract(r.c, r.st, r.s);
  return marketDemand(city, slot.p) * a / (1 + sum);
}
function setSlotProduct(c, slot, pid){
  if (slot.p === pid) return;
  if (slot.p && slot.stock > 0){ c.cash += slot.stock * PBY[slot.p].cost * .5; }
  Object.assign(slot, emptySlot(), {p:pid || null});
  if (pid) slot.price = PBY[pid].ref;
}
function openStore(c, city){
  const cost = buildCost(c, city); if (c.stores[city] || c.cash < cost) return false;
  c.cash -= cost; c.stores[city] = newStore(1, cost); return true;
}
function upgradeStore(c, city){
  const st = c.stores[city]; if (!st || st.level >= 3) return false;
  const cost = upgradeCost(c, city, st.level); if (c.cash < cost) return false;
  c.cash -= cost; st.value += cost; st.level++;
  while (st.slots.length < SLOTS[st.level]) st.slots.push(emptySlot());
  return true;
}
function borrow(c, amt){ amt = Math.min(amt, creditLeft(c)); if (amt <= 0) return 0; c.loan += amt; c.cash += amt; return amt; }
function repay(c, amt){ amt = Math.min(amt, c.loan, Math.max(0, c.cash)); c.loan -= amt; c.cash -= amt; return amt; }
function tradeShares(c, target, n){
  const t = comp(target), px = sharePrice(t), have = c.shares[target] || 0;
  if (n > 0){ n = Math.min(n, 490000 - have, Math.floor(c.cash / (px * 1.01))); if (n <= 0) return 0; c.cash -= n * px * 1.01; }
  else { n = -Math.min(-n, have); if (n === 0) return 0; c.cash += -n * px * .99; }
  c.shares[target] = have + n; return n;
}

// ---- AI ----
function slotScore(c, city, pid){
  const n = rivalsSelling(city, pid, c).length;
  const est = marketDemand(city, pid) / (n + 2);
  const p = PBY[pid]; const margin = p.ref * c.persona.price - landed(city, pid, c);
  return est * margin - (p.spoil ? est * .15 * p.cost : 0);
}
function cityValue(c, city, slots){
  const sc = PRODUCTS.map(p => slotScore(c, city, p.id)).sort((a, b) => b - a);
  return sc.slice(0, slots).reduce((a, b) => a + b, 0) - CBY[city].rent * RENT_M[slots === 2 ? 1 : slots === 4 ? 2 : 3];
}
function aiTurn(c){
  const P = c.persona;
  // expansion: one new store or one upgrade per week
  const options = CITIES.filter(x => !c.stores[x.id]).map(x => ({city:x.id, cost:buildCost(c, x.id), v:cityValue(c, x.id, 2)}))
    .filter(o => o.v > 0).sort((a, b) => b.v / b.cost - a.v / a.cost);
  const ups = Object.entries(c.stores).filter(([, st]) => st.level < 3)
    .map(([city, st]) => ({city, cost:upgradeCost(c, city, st.level), v:cityValue(c, city, SLOTS[st.level + 1]) - cityValue(c, city, SLOTS[st.level])}))
    .filter(o => o.v > 0).sort((a, b) => b.v / b.cost - a.v / a.cost);
  const bestOpen = options[0], bestUp = ups[0];
  const choice = [bestOpen && {...bestOpen, kind:'open'}, bestUp && {...bestUp, kind:'up'}].filter(Boolean).sort((a, b) => b.v / b.cost - a.v / a.cost)[0];
  if (choice && c.cash > choice.cost + P.reserve){ choice.kind === 'open' ? openStore(c, choice.city) : upgradeStore(c, choice.city); }
  if (c.cash < 15000) borrow(c, 40000);
  if (c.cash > 150000 && c.loan > 0) repay(c, c.cash - 100000);
  // stock the shelves
  for (const [city, st] of Object.entries(c.stores)){
    st.ad = P.ad;
    const ranked = PRODUCTS.map(p => ({id:p.id, s:slotScore(c, city, p.id)})).sort((a, b) => b.s - a.s).slice(0, st.slots.length).map(x => x.id);
    const keep = new Set(st.slots.filter(s => ranked.includes(s.p)).map(s => s.p));
    const todo = ranked.filter(id => !keep.has(id));
    for (const s of st.slots){ if (!ranked.includes(s.p)) setSlotProduct(c, s, todo.shift()); }
    for (const s of st.slots){ if (!s.p) continue;
      const p = PBY[s.p]; s.price = +(p.ref * P.price * (rnd() * .06 + .97)).toFixed(2);
      s.order = Math.max(0, Math.round(forecast(c, city, s) * P.stockF - s.stock)); }
  }
}

// ---- turn ----
function buyStock(c){
  const orders = []; let total = 0;
  for (const [city, st] of Object.entries(c.stores)){ st.wkCogs = 0;
    for (const s of st.slots) if (s.p && s.order > 0){ const u = landed(city, s.p, c); orders.push({st, s, u}); total += s.order * u; } }
  const f = total > Math.max(0, c.cash) ? Math.max(0, c.cash) / total : 1;
  let spent = 0;
  for (const o of orders){ const n = Math.floor(o.s.order * f); o.s.stock += n; const cost = n * o.u; o.st.wkCogs += cost; spent += cost; }
  c.cash -= spent; return {spent, short:f < 1};
}
function startWeek(){
  S.events = S.events.filter(e => e.until >= S.week);
  const news = [];
  for (const f of FESTIVALS) if (f.weeks[0] === wkOfYear(S.week)){
    const goods = Object.entries(f.boost).map(([k, v]) => `${PBY[k].name} ${v >= 1 ? '▲' : '▼'}`).join(', ');
    news.push({tag:'Festival', cls:'fest', text:`${f.name} begins in ${f.cities.length === ALL.length ? 'every city' : f.cities.map(x => CBY[x].name).join(', ')}. ${goods}.`});
  }
  if (S.week > 1 && rnd() < .45){
    const k = pick(['typhoon', 'viral', 'viral', 'shortage', 'strike']);
    if (k === 'typhoon'){ const city = pick(['HK','TK','SH','SE']); S.events.push({kind:k, city, until:S.week}); news.push({tag:'Typhoon', cls:'alert', text:`Typhoon warning in ${CBY[city].name}. Shoppers stay home this week: demand down 65%.`}); }
    if (k === 'viral'){ const p = pick(PRODUCTS); S.events.push({kind:k, p:p.id, until:S.week + 1}); news.push({tag:'Trend', cls:'fest', text:`${p.name} go viral on social media. Demand up 80% in every city for 2 weeks.`}); }
    if (k === 'shortage'){ const p = pick(PRODUCTS); S.events.push({kind:k, p:p.id, until:S.week + 2}); news.push({tag:'Supply', cls:'alert', text:`Factory shortage: wholesale ${p.name} cost 40% more for 3 weeks.`}); }
    if (k === 'strike'){ S.events.push({kind:k, until:S.week + 1}); news.push({tag:'Shipping', cls:'alert', text:`Port congestion across the region. Shipping costs triple for 2 weeks.`}); }
  }
  const old = S.rate;
  if (S.week > 1 && rnd() < .3){ S.rate = Math.min(.008, Math.max(.0012, S.rate + (rnd() < .5 ? -1 : 1) * .0006)); }
  if (S.rate !== old) news.push({tag:'Bank', cls:'bank', text:`Regional central bank ${S.rate > old ? 'raises' : 'cuts'} rates. Loans now ${(S.rate * 5200).toFixed(1)}% a year.`});
  for (const c of S.companies) if (!c.human || c.aiCover) aiTurn(c);
  S.news = news;
}
function endWeek(){
  const rep = {week:S.week, byCo:{}};
  for (const c of S.companies){ c.wk = {rev:0, cogs:0, rent:0, ads:0, interest:0, auto:0, nw0:totalNW(c)}; const b = buyStock(c); c.wk.cogs = b.spent; c.wk.short = b.short; }
  for (const c of S.companies) for (const st of Object.values(c.stores)){ st.wkRev = 0; for (const s of st.slots){ s.sold = 0; s.dem = 0; s.lost = 0; s.spoiled = 0; } }
  for (const city of ALL) for (const p of PRODUCTS){
    const sellers = [];
    for (const c of S.companies){ const st = c.stores[city]; if (!st) continue;
      for (const s of st.slots) if (s.p === p.id && s.price > 0 && s.stock > 0) sellers.push({c, st, s, a:attract(c, st, s)}); }
    if (!sellers.length) continue;
    const D = marketDemand(city, p.id), sum = sellers.reduce((t, x) => t + x.a, 0);
    for (const x of sellers){ const dem = Math.round(D * x.a / (1 + sum)); const sold = Math.min(x.s.stock, dem);
      x.s.dem = dem; x.s.sold = sold; x.s.lost = dem - sold; x.s.stock -= sold;
      const rev = sold * x.s.price; x.c.cash += rev; x.c.wk.rev += rev; x.st.wkRev += rev; }
  }
  for (const c of S.companies){
    for (const [city, st] of Object.entries(c.stores)){
      const rent = rentOf(city, st); c.cash -= rent + st.ad; c.wk.rent += rent; c.wk.ads += st.ad;
      st.last = {rev:st.wkRev, cogs:st.wkCogs, rent, ad:st.ad, profit:st.wkRev - st.wkCogs - rent - st.ad};
      for (const s of st.slots) if (s.p && PBY[s.p].spoil && s.stock > 0){ const lose = Math.ceil(s.stock * PBY[s.p].spoil); s.spoiled = lose; s.stock -= lose; }
    }
    const int = c.loan * loanRate(c); c.cash -= int; c.wk.interest = int;
    if (c.cash < 0){ const need = -c.cash; c.loan += need; c.cash = 0; c.wk.auto = need; }
    c.wk.profit = c.wk.rev - c.wk.cogs - c.wk.rent - c.wk.ads - c.wk.interest;
    c.wk.nw = totalNW(c); c.hist.push(Math.round(c.wk.nw));
    rep.byCo[c.id] = {...c.wk};
  }
  S.report = rep;
  const winner = S.companies.filter(c => totalNW(c) >= S.target).sort((a, b) => totalNW(b) - totalNW(a))[0];
  if (winner) S.over = {winner:winner.id, reason:'target'};
  else if (S.companies.some(c => c.human) && S.companies.filter(c => c.human).every(c => totalNW(c) < -150000)) S.over = {winner:[...S.companies].sort((a, b) => totalNW(b) - totalNW(a))[0].id, reason:'bankrupt'};
  else if (S.week >= S.maxWeeks) S.over = {winner:[...S.companies].sort((a, b) => totalNW(b) - totalNW(a))[0].id, reason:'time'};
  S.week++;
  if (!S.over) startWeek();
}
function newGame(playerIds, opts = {}){
  const humans = Array.isArray(playerIds) ? playerIds : [playerIds];
  const pers = [...PERSONAS];
  S = {week:1, maxWeeks:opts.weeks || WEEKS, target:TARGET, rate:.003, events:[], news:[], over:null, report:null, sel:null,
    companies:COMPANIES.map(d => ({...d, human:humans.includes(d.id), cash:START_CASH, loan:0, stores:{}, shares:{}, hist:[START_CASH], wk:null, persona:humans.includes(d.id) ? PERSONAS[2] : (pers.shift() || PERSONAS[2])}))};
  for (const c of S.companies){ c.stores[c.hq] = newStore(1, CBY[c.hq].cost); }
  const hs = S.companies.filter(c => c.human);
  if (hs.length) S.sel = hs[0].hq;
  for (const me of hs){
    const st = me.stores[me.hq];
    const best = PRODUCTS.map(p => ({id:p.id, s:slotScore(me, me.hq, p.id)})).sort((a, b) => b.s - a.s);
    st.slots.forEach((s, i) => { setSlotProduct(me, s, best[i].id); });
  }
  startWeek();
  for (const me of hs){ const st = me.stores[me.hq]; st.slots.forEach(s => { s.order = Math.round(forecast(me, me.hq, s) * 1.1); }); }
}
// one player decision, as sent over the network: [type, ...args]. Every rule is re-checked here.
function applyAction(c, a){
  if (!c || !Array.isArray(a)) return;
  const [t, x, y, z] = a, st = c.stores[x], slot = st && Number.isInteger(y) ? st.slots[y] : null;
  switch (t){
    case 'open': if (CBY[x]) openStore(c, x); break;
    case 'upgrade': upgradeStore(c, x); break;
    case 'ad': if (st) st.ad = [0, 1000, 2500, 5000, 10000].includes(+y) ? +y : 0; break;
    case 'prod': if (slot && (!z || PBY[z]) && !(z && st.slots.some(o => o !== slot && o.p === z))) setSlotProduct(c, slot, z || null); break;
    case 'price': if (slot && slot.p) slot.price = Math.min(100000, Math.max(.1, +z || PBY[slot.p].ref)); break;
    case 'order': if (slot) slot.order = Math.min(1e6, Math.max(0, Math.round(+z || 0))); break;
    case 'borrow': borrow(c, Math.max(0, +x || 0)); break;
    case 'repay': repay(c, Math.max(0, +x || 0)); break;
    case 'trade': if (x !== c.id && S.companies.some(o => o.id === x)) tradeShares(c, x, Math.round(+y || 0)); break;
  }
}

function mine(){ return NET ? (S && MY.co ? comp(MY.co) : null) : S.companies.find(c => c.human); }
function save(){ if (NET) return; try { localStorage.setItem('monsoon-merchants-save', JSON.stringify(S)); } catch(e) {} }
function load(){ try { const t = localStorage.getItem('monsoon-merchants-save'); return t ? JSON.parse(t) : null; } catch(e) { return null; } }

function render(){ renderNet(); if (!S || !mine()) return; renderStats(); renderMap(); renderStore(); renderSide(); }

function renderStats(){
  const me = mine(), nw = totalNW(me);
  $('#stats').innerHTML = `
    <div class="stat"><span class="label">Week</span><b>${Math.min(S.week, S.maxWeeks)}/${S.maxWeeks} · ${weekDate(Math.min(S.week, S.maxWeeks))}</b></div>
    <div class="stat"><span class="label">Cash</span><b>${money(me.cash)}</b></div>
    <div class="stat"><span class="label">Loan</span><b>${money(me.loan)}</b></div>
    <div class="stat"><span class="label">Net worth</span><b>${money(nw)}</b></div>
    <div class="stat goal"><span class="label">Goal</span><b>${short(S.target)}</b></div>`;
  const b = $('#endbtn');
  if (NET){ const rd = myReady(); b.disabled = !!S.over || !MY.co; b.textContent = S.over ? 'Game over' : rd ? 'Ready ✓ · undo' : `Ready for week ${S.week}`; b.classList.toggle('isready', rd); }
  else { b.disabled = !!S.over; b.textContent = S.over ? 'Game over' : `End week ${S.week}`; b.classList.remove('isready'); }
}

function proj(lon, lat){ return [20 + (lon - 66) / (146 - 66) * 560, 20 + (44 - lat) / (54) * 380]; }
function renderMap(){
  let g = '';
  for (let lon = 70; lon <= 140; lon += 10){ const [x] = proj(lon, 0); g += `<line class="gl" x1="${x}" y1="10" x2="${x}" y2="410"/><text class="gt" x="${x + 3}" y="408">${lon}°E</text>`; }
  for (let lat = -10; lat <= 40; lat += 10){ const [, y] = proj(80, lat); g += `<line class="gl" x1="10" y1="${y}" x2="590" y2="${y}"/><text class="gt" x="14" y="${y - 3}">${lat === 0 ? 'EQ' : Math.abs(lat) + '°' + (lat < 0 ? 'S' : 'N')}</text>`; }
  const lanes = [['MB','SG'],['SG','JK'],['SG','BK'],['SG','HK'],['HK','SH'],['SH','SE'],['SH','TK'],['SE','TK']];
  for (const [a, b] of lanes){ const [x1, y1] = proj(CBY[a].lon, CBY[a].lat), [x2, y2] = proj(CBY[b].lon, CBY[b].lat); const mx = (x1 + x2) / 2 + (y2 - y1) * .15, my = (y1 + y2) / 2 - (x2 - x1) * .15; g += `<path class="lane" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}"/>`; }
  const labelPos = {SG:[10,16], JK:[10,4], BK:[-12,-12,'end'], MB:[10,-10], HK:[-12,16,'end'], SH:[10,14], SE:[-12,-10,'end'], TK:[-10,22,'end']};
  for (const c of CITIES){
    const [x, y] = proj(c.lon, c.lat), [dx, dy, anchor] = labelPos[c.id];
    const owners = S.companies.filter(k => k.stores[c.id]);
    const ev = S.events.some(e => e.kind === 'typhoon' && e.city === c.id) ? ' ⚠' : festivalsFor(c.id, S.week).length ? ' ✦' : '';
    g += `<g class="pin${S.sel === c.id ? ' sel' : ''}" style="--cityc:var(--city-${c.id})" data-act="city" data-city="${c.id}" tabindex="0" role="button" aria-label="${c.name}">
      <circle class="ring" cx="${x}" cy="${y}" r="13"/>
      ${owners.map((k, i) => `<circle cx="${x - 9 + i * 6}" cy="${y + 13}" r="2.6" fill="${col(k)}"/>`).join('')}
      <circle class="dot" cx="${x}" cy="${y}" r="6"/>
      <text x="${x + dx}" y="${y + dy}" text-anchor="${anchor || 'start'}">${c.name}<tspan class="evt">${ev}</tspan></text></g>`;
  }
  $('#map').innerHTML = `<h2>Trade map</h2>
    <svg viewBox="0 0 600 420" role="img" aria-label="Map of the eight trading cities">${g}</svg>
    <div class="citylist">${CITIES.map(c => `<button class="cityb${S.sel === c.id ? ' sel' : ''}" style="--cityc:var(--city-${c.id})" type="button" data-act="city" data-city="${c.id}">
      <span class="cn">${flag(c.id)}${c.name}</span><span class="owners">${S.companies.filter(k => k.stores[c.id]).map(k => `<span style="background:${col(k)}" title="${esc(k.name)}"></span>`).join('')}</span></button>`).join('')}</div>
    <p class="small muted" style="margin:10px 0 0">✦ festival this week · ⚠ typhoon · dots show who has a store there</p>`;
}

function demandWord(m){ return m >= 1.6 ? ['Booming','good'] : m >= 1.15 ? ['Strong','good'] : m <= .6 ? ['Weak','bad'] : ['Normal','']; }

function renderStore(){
  const me = mine(), city = S.sel, C = CBY[city], st = me.stores[city];
  const fests = festivalsFor(city, S.week), typh = S.events.find(e => e.kind === 'typhoon' && e.city === city);
  const loves = PRODUCTS.map((p, i) => ({p, t:C.taste[i]})).sort((a, b) => b.t - a.t).slice(0, 3);
  $('#store').style.setProperty('--city', `var(--city-${city})`);
  let h = `<div class="cityhead"><div class="cityband">${flag(city)}<div><div class="label">${esc(C.country)}</div><h2>${C.name}</h2><div class="nick">${esc(C.nick)}</div></div></div><div style="flex-basis:100%">
    <div class="facts"><span>Shoppers <b>×${C.traffic.toFixed(1)}</b></span><span>Rent <b>${money(C.rent)}</b>/wk (kiosk)</span><span>Shipping <b>${(shipPct(city, me) * 100).toFixed(1)}%</b></span></div></div></div>
    <div class="favs"><span class="label">Locals love</span><ol class="favlist">${loves.map((x, i) => `<li><span class="pico">${icon(x.p.id)}<span class="rank">${i + 1}</span></span><span class="favtx"><b>${x.p.name}</b><span class="small muted">${x.t > 1 ? '+' + Math.round((x.t - 1) * 100) + '% shoppers' : 'average demand'}</span></span></li>`).join('')}</ol></div>
    <div class="chips">
    ${fests.map(f => `<span class="chip good">✦ ${f.name}</span>`).join('')}
    ${typh ? `<span class="chip bad">⚠ Typhoon: demand −65%</span>` : ''}</div>`;
  const rivalsHere = S.companies.filter(k => !k.human && k.stores[city]);

  if (!st){
    const cost = buildCost(me, city);
    h += `<div class="openbox"><div><h3 style="font-size:15px">Open a kiosk in ${C.name}</h3>
      <div class="muted small">2 shelf slots · rent ${money(C.rent)}/wk · ${rivalsHere.length ? 'Rivals here: ' + rivalsHere.map(k => esc(k.name)).join(', ') : 'No rivals here yet'}</div></div>
      <button class="btn primary" type="button" data-act="open" ${me.cash < cost ? 'disabled' : ''}>Open for ${money(cost)}</button></div>`;
    if (me.cash < cost) h += `<p class="small warn">You need ${money(cost - me.cash)} more cash. Borrow from the bank or wait for sales.</p>`;
  } else {
    const upCost = st.level < 3 ? upgradeCost(me, city, st.level) : 0;
    h += `<div class="storebar"><div><span class="lvl">${LVL_NAME[st.level]}</span> <span class="muted small">· ${st.slots.length} slots · rent ${money(rentOf(city, st))}/wk</span></div>
      <label for="ad-${city}">Ads/wk <select id="ad-${city}" data-field="ad">${[0, 1000, 2500, 5000, 10000].map(v => `<option value="${v}" ${st.ad === v ? 'selected' : ''}>${money(v)}</option>`).join('')}</select></label>
      ${st.level < 3 ? `<button class="btn small" type="button" data-act="upgrade" ${me.cash < upCost ? 'disabled' : ''}>Upgrade to ${LVL_NAME[st.level + 1]} · ${short(upCost)}</button>` : '<span class="chip good">Max size</span>'}</div>`;
    if (st.last) h += `<p class="small muted" style="margin:-4px 0 12px">Last week: revenue <b class="num">${money(st.last.rev)}</b> · stock bought ${money(st.last.cogs)} · rent+ads ${money(st.last.rent + st.last.ad)} · <b class="num ${st.last.profit >= 0 ? 'good' : 'warn'}">${st.last.profit >= 0 ? 'profit' : 'loss'} ${money(st.last.profit)}</b></p>`;
    const used = st.slots.map(s => s.p);
    h += `<div class="slots">` + st.slots.map((s, i) => {
      const opts = `<option value="">Empty shelf</option>` + PRODUCTS.map(p => `<option value="${p.id}" ${s.p === p.id ? 'selected' : ''} ${used.includes(p.id) && s.p !== p.id ? 'disabled' : ''}>${p.name}</option>`).join('');
      if (!s.p) return `<div class="slot"><div class="f prod"><span class="label">Slot ${i + 1}</span><div class="prodpick"><span class="pico empty-ico">+</span><select id="p-${city}-${i}" data-field="prod" data-slot="${i}">${opts}</select></div></div><div class="empty" style="grid-column:2/-1">Pick a product to stock this shelf.</div></div>`;
      const p = PBY[s.p], u = landed(city, s.p, me), fc = forecast(me, city, s), rv = rivalsSelling(city, s.p, me);
      const margin = s.price - u;
      return `<div class="slot">
        <div class="f prod"><span class="label">Slot ${i + 1}</span><div class="prodpick"><span class="pico" title="${p.name}">${icon(p.id)}</span><select id="p-${city}-${i}" data-field="prod" data-slot="${i}">${opts}</select></div></div>
        <div class="f"><label class="label" for="pr-${city}-${i}">Price / ${p.unit}</label><input id="pr-${city}-${i}" type="number" min="0.1" step="${p.ref >= 100 ? 5 : .1}" value="${s.price}" data-field="price" data-slot="${i}"></div>
        <div class="f"><label class="label" for="o-${city}-${i}">Weekly order</label><div class="inline"><input id="o-${city}-${i}" type="number" min="0" step="${p.base >= 1000 ? 50 : 5}" value="${s.order}" data-field="order" data-slot="${i}"><button class="btn small" type="button" data-act="suggest" data-slot="${i}" title="Set order to forecast demand minus stock">Auto</button></div></div>
        <div class="f"><span class="label">On shelf</span><b class="num" style="font-size:15px">${int(s.stock)}</b></div>
        <div class="row2">
          <span>Cost <b>${price(u)}</b> · usual price <b>${price(p.ref)}</b> · margin <b class="${margin > 0 ? '' : 'warn'}">${price(margin)}</b></span>
          <span>Forecast <b>${int(fc)}</b> ${p.unit}s</span>
          ${s.dem ? `<span>Last week sold <b>${int(s.sold)}</b> of ${int(s.dem)} wanted${s.lost > 0 ? ` <span class="warn">· ran out, lost ${int(s.lost)}</span>` : ''}${s.spoiled ? ` <span class="warn">· ${int(s.spoiled)} spoiled</span>` : ''}</span>` : ''}
          ${p.spoil ? `<span class="warn">Perishable: ${p.spoil * 100}% of leftovers spoil weekly</span>` : ''}
          <span>Rivals: ${rv.length ? rv.map(r => `<b style="color:${col(r.c)}">${price(r.s.price)}</b>`).join(' ') : 'none'}</span>
        </div></div>`;
    }).join('') + `</div>`;
    let oc = 0; for (const s of st.slots) if (s.p) oc += s.order * landed(city, s.p, me);
    h += `<div class="orderline"><span>This store's orders will cost <b>${money(oc)}</b> when the week ends.</span><button class="btn small" type="button" data-act="autoall">Auto-order all shelves</button></div>`;
  }

  h += `<div class="intel"><h3 style="font-size:13px;margin-bottom:6px">Market in ${C.name} this week</h3><div class="tablewrap"><table>
    <thead><tr><th>Product</th><th>Demand</th><th class="r">Shoppers</th><th class="r">Your cost</th><th class="r">Usual price</th><th>Rival prices</th></tr></thead><tbody>
    ${PRODUCTS.map(p => { const m = demandMult(city, p.id), [w, cls] = demandWord(m), D = marketDemand(city, p.id), rv = rivalsSelling(city, p.id, me);
      return `<tr><td>${icon(p.id, 'tico')}${p.name}</td><td class="${cls}">${w}</td><td class="r num">${int(D)}</td><td class="r num">${price(landed(city, p.id, me))}</td><td class="r num">${price(p.ref)}</td>
      <td>${rv.length ? rv.map(r => `<span class="num" style="color:${col(r.c)}">${price(r.s.price)}</span>`).join(' ') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
    </tbody></table></div><p class="small muted">Shoppers is the whole city's weekly demand. Stores carrying the same product split it, and cheaper, bigger, better-advertised stores win a larger share. Price too high and shoppers buy nothing.</p></div>`;
  $('#store').innerHTML = h;
}

function spark(hist, color){
  const h = hist.slice(-20); if (h.length < 2) return '';
  const mn = Math.min(...h, 0), mx = Math.max(...h, 1), W = 70, H = 18;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * W).toFixed(1)},${(H - (v - mn) / (mx - mn) * H).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function renderSide(){
  const me = mine();
  const ranked = [...S.companies].sort((a, b) => totalNW(b) - totalNW(a));
  const lb = ranked.map((c, i) => {
    const nw = totalNW(c), pct = Math.max(0, Math.min(100, nw / S.target * 100)), own = me.shares[c.id] || 0;
    return `<div class="lbrow"><span class="sw" style="background:${col(c)}"></span><span class="nm">${i + 1}. ${esc(c.name)}${c.id === me.id ? ' (you)' : c.human && c.player ? ' · ' + esc(c.player) : ''}</span><span class="nw">${short(nw)}</span>
      <div class="progress"><i style="width:${pct}%;background:${col(c)}"></i></div>
      <div class="sub"><span>${Object.keys(c.stores).length} stores</span>${c.human ? (c.id === me.id ? '' : '<span>Human</span>') : `<span>AI · ${c.persona.label}</span>`}<span class="num">share ${price(sharePrice(c))}</span>${spark(c.hist, col(c))}
      ${c.id === me.id ? '' : `<span class="btnrow" style="margin-left:auto"><button class="btn small" type="button" data-act="buysh" data-co="${c.id}">Buy 10k</button><button class="btn small" type="button" data-act="sellsh" data-co="${c.id}" ${own ? '' : 'disabled'}>Sell</button></span>
      ${own ? `<span style="flex-basis:100%">You own ${int(own)} shares (${(own / SHARES * 100).toFixed(1)}%) = ${money(own * sharePrice(c))}</span>` : ''}`}</div></div>`;
  }).join('');
  const rate = loanRate(me) * 5200;
  $('#side').innerHTML = playersPanel() + `
    <div class="panel"><h2>Rivals</h2><div class="lb">${lb}</div>
      <p class="small muted" style="margin:8px 0 0">First to ${short(S.target)} net worth wins, or the richest after week ${S.maxWeeks}. Shares rise and fall with each company's net worth; owning rivals' shares counts toward yours.</p></div>
    <div class="panel"><h2>Bank of the Straits</h2>

// --- a PeerJS look-alike over BroadcastChannel, for testing in several tabs of one browser ---
class Emitter { constructor(){ this._h = {}; } on(e, f){ (this._h[e] = this._h[e] || []).push(f); return this; } emit(e, ...a){ (this._h[e] || []).forEach(f => f(...a)); } }
class LocalConn extends Emitter {

  send(data){ if (this.open) this.peer._post({k:'data', to:this.peerId, cid:this.cid, data:clone(data)}); }
  close(){ if (!this.open) return; this.open = false; this.peer._post({k:'close', to:this.peerId, cid:this.cid}); delete this.peer.conns[this.cid]; this.emit('close'); }
}
class LocalPeer extends Emitter {
  constructor(id){ super(); this.id = id || 'p-' + genToken(); this.nonce = genToken(); this.conns = {}; this.opened = false; this.dead = false;
    this.bc = new BroadcastChannel('mm-local-net'); this.bc.onmessage = ev => this._recv(ev.data);
    addEventListener('pagehide', () => this.destroy());
    this._post({k:'claim'}); setTimeout(() => { if (!this.dead && !this.taken){ this.opened = true; this.emit('open', this.id); } }, 200); }
  _post(m){ if (this.dead) return; m.from = this.id; m.nonce = this.nonce; this.bc.postMessage(m); }
  _recv(m){
    if (this.dead || m.nonce === this.nonce) return;
    if (m.k === 'claim' && m.from === this.id && this.opened) return this._post({k:'taken', to:this.id, forNonce:m.nonce});
    if (m.k === 'taken' && m.forNonce === this.nonce){ this.taken = true; return this.emit('error', {type:'unavailable-id'}); }
    if (m.to !== this.id || !this.opened) return;
    if (m.k === 'connect'){ const c = new LocalConn(this, m.cid, m.from); c.open = true; this.conns[m.cid] = c; this.emit('connection', c); this._post({k:'accept', to:m.from, cid:m.cid}); setTimeout(() => c.emit('open'), 0); }
    const c = this.conns[m.cid]; if (!c) return;
    if (m.k === 'accept'){ c.open = true; c.accepted = true; c.emit('open'); }
    if (m.k === 'data') c.emit('data', m.data);
    if (m.k === 'close'){ c.open = false; delete this.conns[m.cid]; c.emit('close'); }
  }
  connect(remote){ const c = new LocalConn(this, genToken(), remote); this.conns[c.cid] = c; this._post({k:'connect', to:remote, cid:c.cid});
    setTimeout(() => { if (!c.accepted && !this.dead){ delete this.conns[c.cid]; this.emit('error', {type:'peer-unavailable'}); } }, 1500); return c; }
  reconnect(){}
  destroy(){ if (this.dead) return; Object.values(this.conns).forEach(c => c.close()); this.dead = true; try { this.bc.close(); } catch(e) {} }
}
function loadPeerLib(){

      const el = document.createElement('script'); el.src = srcs[0];

      el.onerror = () => { el.remove(); tryLoad(srcs.slice(1)); };

    tryLoad(['vendor/peerjs-1.5.4.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js']);

}

// --- shared helpers ---

function hostCreate(name){

function hostResumeFrom(save, freshCode){

function hostOpen(){
  loadPeerLib().then(Cls => {
    const attempt = () => {
      if (!NET || NET.role !== 'host') return;
      const peer = makePeer(Cls, MP_PREFIX + NET.code); NET.peer = peer;
      peer.on('open', () => { if (NET && NET.peer === peer){ NET.online = true; NET.status = ''; NET.retries = 0; hostStatus(); } });
      peer.on('connection', conn => hostAccept(conn));
      peer.on('disconnected', () => { if (NET && NET.peer === peer && !NET.closing) setTimeout(() => { try { peer.reconnect(); } catch(e) {} }, 2000); });
      peer.on('error', err => {
        if (!NET || NET.peer !== peer) return;

          else NET.status = 'Could not reopen this room code. Use "Copy save", then import it to get a new code.';

function hostAccept(conn){

  conn.on('error', () => {});
}
function hostOnMsg(conn, m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hello'){
    const token = String(m.token || '').slice(0, 40); if (!token) return;
    let s = NET.seats.find(x => x.token === token);
    if (s && s.host){ safeSend(conn, {t:'reject', reason:'You are already the host of this room in another tab.'}); return; }
    if (!s){ s = {token, name:'', co:null, connected:true, ready:false, actions:[]}; NET.seats.push(s); }
    for (const [k, v] of NET.conns) if (v === s && k !== conn){ NET.conns.delete(k); try { k.close(); } catch(e) {} }
    s.name = String(m.name || s.name || 'Player').slice(0, 20); s.connected = true; s.forceAI = false; s.lastSeen = Date.now();

function hostPick(seat, co){

function hostStart(){

  NET.mp.started = true; NET.mp.paused = false; NET.mp.deadline = Date.now() + NET.mp.timer * 1000;
  for (const s of NET.seats){ s.actions = []; s.ready = false; }
  MY.co = mySeat().co; S = null; setView(AUTH, []);
  hostSave(); for (const [k, v] of NET.conns) safeSend(k, stateMsg(v));
  closeModal(); hostStatus(); render();
}
function stateMsg(seat){
  return {t:'state', S:AUTH, mp:pubMP(), you:seat.co,
    backup:{seats:NET.seats.map(s => ({token:s.token, name:s.name, co:s.co, host:!!s.host})), mp:{timer:NET.mp.timer, weeks:NET.mp.weeks, drop:NET.mp.drop}}};
}
function hostStatus(){ if (!NET || NET.role !== 'host') return; NET.lastStatus = Date.now(); const mp = pubMP(); for (const [k, v] of NET.conns) safeSend(k, {t:'status', mp, you:v.co}); renderNet(); }
function hostSaveObj(){ return {v:1, code:NET.code, S:AUTH, mp:{timer:NET.mp.timer, weeks:NET.mp.weeks, drop:NET.mp.drop},
  seats:NET.seats.filter(s => s.co || s.host).map(s => ({token:s.token, name:s.name, co:s.co, host:!!s.host, actions:s.actions})), when:Date.now()}; }

function hostTimers(){
  NET.timerId = setInterval(() => {

    const now = Date.now();
    for (const [k, s] of NET.conns) if (now - (s.lastSeen || now) > 10000){ try { k.close(); } catch(e) {} hostDrop(k); }
    const m = NET.mp;
    if (m.started && !m.paused && m.timer && AUTH && !AUTH.over && now >= m.deadline) hostResolve();
    if (now - (NET.lastStatus || 0) > 2000) hostStatus();

}

// --- client ---
function clientJoin(code, name){
  const p = player(); p.name = name; store('mm-player', p);
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  teardown();
  NET = {role:'client', code, token:p.token, name, mp:null, actions:[], ready:false, seenWeek:0, status:`Connecting to room ${code}…`, lastMsg:Date.now(), lost:false};
  S = null; AUTH = null; MY.co = null; store('mm-join', {code});
  showLobby();
  loadPeerLib().then(Cls => {
    if (!NET || NET.role !== 'client') return;
    const peer = makePeer(Cls); NET.peer = peer;
    peer.on('open', () => clientConnect());
    peer.on('disconnected', () => { if (NET && NET.peer === peer) setTimeout(() => { try { peer.reconnect(); } catch(e) {} }, 2000); });
    peer.on('error', err => {
      if (!NET || NET.peer !== peer) return;
      if (err.type === 'peer-unavailable'){ NET.lost = true; NET.status = `Can't reach room ${NET.code}. The host may be offline or still reopening it. Retrying…`; renderNet(); clientRetry(); }
      else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)){ NET.status = 'Connection problem. Retrying…'; renderNet(); }
    });
  }).catch(e => { if (NET){ NET.status = e.message; renderNet(); } });
  NET.timerId = setInterval(() => {
    if (!NET || NET.role !== 'client') return;
    const now = Date.now();
    if (NET.conn && NET.conn.open) safeSend(NET.conn, {t:'ping'});
    if (now - NET.lastMsg > 9000){ NET.lastMsg = now; if (!NET.lost){ NET.lost = true; NET.status = 'Lost the host. Reconnecting…'; renderNet(); } clientConnect(); }
    tickClock();
  }, 2000);
  NET.clockId = setInterval(tickClock, 500);
}
function clientRetry(ms = 3000){ if (!NET || NET.role !== 'client' || NET.retryT) return; NET.retryT = setTimeout(() => { if (NET){ NET.retryT = null; clientConnect(); } }, ms); }
function clientConnect(){
  if (!NET || NET.role !== 'client' || !NET.peer) return;
  NET.lastMsg = Math.max(NET.lastMsg, Date.now() - 4000);
  if (NET.conn){ const old = NET.conn; NET.conn = null; try { old.close(); } catch(e) {} }
  let conn; try { conn = NET.peer.connect(MP_PREFIX + NET.code, {reliable:true, serialization:'json'}); } catch(e) { return; }
  NET.conn = conn;
  conn.on('open', () => { if (NET && NET.conn === conn) safeSend(conn, {t:'hello', token:NET.token, name:NET.name}); });
  conn.on('data', m => { if (NET && NET.conn === conn) clientOnMsg(m); });
  conn.on('close', () => { if (NET && NET.conn === conn){ NET.lost = true; NET.status = 'Lost the host. Reconnecting…'; renderNet(); clientRetry(); } });
  conn.on('error', () => {});
}
function clientSendPlan(now){
  clearTimeout(NET.planT);
  const send = () => { if (NET && NET.conn && AUTH) safeSend(NET.conn, {t:'plan', week:AUTH.week, actions:NET.actions, ready:NET.ready}); };
  now ? send() : (NET.planT = setTimeout(send, 250));
}
function clientOnMsg(m){
  if (!m || typeof m !== 'object') return;
  NET.lastMsg = Date.now();
  if (NET.lost){ NET.lost = false; NET.status = ''; if (AUTH) clientSendPlan(true); }
  if (m.t === 'welcome'){ NET.joined = true; NET.status = ''; MY.co = m.co || MY.co; store('mm-join', {code:NET.code}); renderNet(); }
  if (m.t === 'reject'){ NET.status = m.reason; renderNet(); }
  if (m.t === 'status'){ NET.mp = m.mp; if (!AUTH || !AUTH.companies.some(c => c.id === MY.co && c.human)) MY.co = m.you || null; NET.deadline = Date.now() + (m.mp.remaining || 0);
    if (!m.mp.started || !MY.co) showLobby(); renderNet(); if (S && mine()) renderStats(); }
  if (m.t === 'state'){
    const newWeek = !AUTH || m.S.week !== AUTH.week;
    AUTH = m.S; NET.mp = m.mp; NET.deadline = Date.now() + (m.mp.remaining || 0); MY.co = m.you || null;
    if (newWeek){ NET.actions = []; NET.ready = false; }
    setView(AUTH, NET.actions);
    store('mm-backup', {code:NET.code, S:AUTH, seats:m.backup.seats, mp:m.backup.mp, when:Date.now()});
    if (!MY.co){ showLobby(); return; }
    if (NET.modal === 'lobby') closeModal();
    render();
    if (newWeek && NET.seenWeek && AUTH.week > NET.seenWeek) afterNewWeek();
    else if (AUTH.over) showEnd();
    NET.seenWeek = AUTH.week;
  }
}
function clientTakeover(){
  const b = fetchKey('mm-backup'); if (!b || !b.S) return;
  hostResumeFrom({code:b.code, S:b.S, mp:b.mp, seats:b.seats.map(s => ({...s, host:s.token === player().token}))}, true);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, me = S && mine(), city = S && S.sel, st = me && me.stores[city];
  const si = el.dataset.slot != null ? +el.dataset.slot : null, slot = si != null && st ? st.slots[si] : null;
  const name = () => (($('#mp-name') || {}).value || '').trim().slice(0, 20);
  switch (act){
    case 'start': teardown(); newGame(el.dataset.co); closeModal(); save(); break;
    case 'resume': teardown(); S = load(); closeModal(); break;
    case 'newgame': teardown(); try { localStorage.removeItem('monsoon-merchants-save'); } catch(e) {} showStart(); return;
    case 'back': showStart(); return;
    case 'help': showModal(`<h1 style="font-size:28px">How to play</h1>${HOWTO}<div class="howto"><b>Tips</b><ul><li>Check the market table: a product locals love, with no rivals, is the easiest money.</li><li>Order ahead of festivals in "Coming up". Demand jumps the week they start.</li><li>Perishables spoil, so order close to the forecast. Use <b>Auto</b>.</li><li>Your perk: ${esc(me ? me.perkText : '')}.</li></ul></div><div class="mfoot"><button class="btn primary" type="button" data-act="close">Back to trading</button></div>`); return;
    case 'close': if (NET) NET.modal = null; closeModal(); if (NET && NET.role === 'client' && !MY.co) showLobby(); break;
    case 'city': S.sel = el.dataset.city; break;
    case 'open': doAct(['open', city]); break;
    case 'upgrade': doAct(['upgrade', city]); break;
    case 'suggest': if (slot) doAct(['order', city, si, Math.max(0, Math.round(forecast(me, city, slot) * 1.1 - slot.stock))]); break;
    case 'autoall': st.slots.forEach((s, i) => { if (s.p) doAct(['order', city, i, Math.max(0, Math.round(forecast(me, city, s) * 1.1 - s.stock))]); }); break;
    case 'borrow': doAct(['borrow', +el.dataset.amt]); break;
    case 'repay': doAct(['repay', +el.dataset.amt]); break;
    case 'buysh': doAct(['trade', el.dataset.co, 10000]); break;
    case 'sellsh': doAct(['trade', el.dataset.co, -(me.shares[el.dataset.co] || 0)]); break;
    case 'end':
      if (!S || S.over) return;
      if (NET) { toggleReady(); return; }
      endWeek(); save(); render(); S.over ? showEnd() : showReport(); return;
    // multiplayer
    case 'mp-host': if (!name()) return mpError('Type your name first, so friends know who is hosting.'); hostCreate(name()); return;
    case 'mp-join': case 'mp-rejoin': {
      const code = act === 'mp-rejoin' ? el.dataset.code : (($('#mp-code') || {}).value || '').trim();
      if (!name()) return mpError('Type your name first.');
      if (!/^[A-Za-z0-9]{4,8}$/.test(code)) return mpError('Room codes are 5 letters or numbers, like K7QMX.');

    case 'mp-resume': { const hs = fetchKey('mm-host'); if (hs) hostResumeFrom(hs, false); return; }

    case 'mp-doimport': {
      const raw = (($('#mp-importtext') || {}).value || '').trim(), err = $('#mp-importerr');

  const i = el.dataset.slot != null ? +el.dataset.slot : null, slot = i != null ? st.slots[i] : null;
  if (el.dataset.field === 'ad') doAct(['ad', city, +el.value]);
  if (el.dataset.field === 'prod' && slot){ doAct(['prod', city, i, el.value || null]); if (slot.p) doAct(['order', city, i, Math.max(0, Math.round(forecast(me, city, slot) * 1.1))]); }
  if (el.dataset.field === 'price' && slot) doAct(['price', city, i, +el.value]);
  if (el.dataset.field === 'order' && slot) doAct(['order', city, i, +el.value]);
  render();
  const again = document.getElementById(el.id); if (again) again.focus();
});

function boot(data){
  if (data && data.S && !NET) { S = data.S; render(); if (S.over) showEnd(); return; }
  const saved = load();
  if (saved && !saved.over){ S = saved; render(); showStart(); return; }
  // show a live board behind the start screen
  newGame('lion'); render(); S = null; showStart();
}

window.claude?.hot?.snapshot?.(() => NET ? {} : {S});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
