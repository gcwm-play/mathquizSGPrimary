<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lanternmaze! Duel in the Dark</title>
<meta name="description" content="A pop-art maze race in the dark: Vespera and Kaida each get a matched maze and only a 3×3 lantern of light. Play vs AI or a friend on one device.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#121018; --yel:#FFD400; --red:#FF2E4C; --cyan:#00B7FF; --mag:#FF3EA5; --blue:#2B3CFF; --paper:#FFF8E6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden; touch-action:none;
    font-family:'Nunito', system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  canvas#game { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }
  .overlay { position:fixed; inset:0; z-index:10; overflow-y:auto; touch-action:pan-y; display:flex; flex-direction:column; align-items:center;
    padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    background-color:var(--yel);
    background-image:radial-gradient(circle, rgba(255,46,76,.28) 28%, transparent 30%), radial-gradient(circle, rgba(255,46,76,.28) 28%, transparent 30%);
    background-size:16px 16px; background-position:0 0, 8px 8px; text-align:center; }
  .overlay.hidden { display:none; }
  .inner { margin:auto 0; width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; }
  .titlewrap { position:relative; padding:18px 34px 12px; margin-bottom:4px; }
  .titlewrap svg { position:absolute; inset:-14px -30px; width:calc(100% + 60px); height:calc(100% + 28px); z-index:0; }
  h1 { position:relative; z-index:1; font-family:'Bangers', 'Impact', sans-serif; font-weight:400; font-size:clamp(40px,10vw,78px); line-height:.95; margin:0;
    letter-spacing:.04em; color:var(--yel); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill;
    text-shadow:5px 5px 0 var(--ink); transform:rotate(-3deg); }
  .sub { position:relative; z-index:1; display:inline-block; font-family:'Bangers', sans-serif; letter-spacing:.08em; font-size:18px; margin:10px 0 14px;
    background:#fff; border:3px solid var(--ink); padding:4px 12px; box-shadow:4px 4px 0 var(--ink); transform:rotate(1.5deg); }
  .panel { background:#fff; border:4px solid var(--ink); box-shadow:7px 7px 0 var(--ink); border-radius:4px; padding:12px 14px 16px; width:100%; max-width:640px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:4px 0; align-items:center; }
  .lbl { font-family:'Bangers', sans-serif; font-size:17px; letter-spacing:.08em; width:100%; margin-top:10px; color:var(--ink); }
  .opt { border:3px solid var(--ink); background:#fff; color:var(--ink); border-radius:999px; padding:7px 14px;
    font:800 14px Nunito, sans-serif; cursor:pointer; box-shadow:3px 3px 0 var(--ink); transition:transform .08s; }
  .opt:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .opt.on { background:var(--cyan); color:#fff; text-shadow:1px 1px 0 var(--ink); }
  .heroes { display:flex; gap:14px; justify-content:center; margin:6px 0 2px; }
  .hero { width:140px; border:4px solid var(--ink); border-radius:4px; padding:8px 6px 6px; cursor:pointer; position:relative; overflow:hidden;
    background-color:var(--bg); background-image:radial-gradient(circle, rgba(255,255,255,.35) 25%, transparent 27%); background-size:10px 10px;
    box-shadow:4px 4px 0 var(--ink); transition:transform .1s; }
  .hero.on { transform:rotate(-2deg) scale(1.04); box-shadow:7px 7px 0 var(--ink); }
  .hero.on::after { content:'ME!'; position:absolute; top:6px; right:6px; font:400 18px Bangers, sans-serif; background:var(--yel); border:3px solid var(--ink); padding:0 6px; transform:rotate(8deg); }
  .hero img { height:128px; display:block; margin:0 auto 6px; }
  .hero b { font-family:'Bangers',sans-serif; font-weight:400; font-size:22px; letter-spacing:.05em; display:block; color:#fff; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; text-shadow:2px 2px 0 var(--ink); }
  .hero span { font-size:11px; font-weight:800; background:#fff; border:2px solid var(--ink); padding:1px 6px; display:inline-block; margin-top:2px; }
  .btn { font-family:'Bangers', sans-serif; font-weight:400; font-size:28px; letter-spacing:.06em; color:#fff; border:4px solid var(--ink); border-radius:6px;
    padding:8px 30px 6px; margin-top:16px; background:var(--red); box-shadow:6px 6px 0 var(--ink); cursor:pointer; -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; text-shadow:2px 2px 0 var(--ink); transform:rotate(-1.5deg); }
  .btn:active { transform:rotate(-1.5deg) translate(3px,3px); box-shadow:3px 3px 0 var(--ink); }
  .btn.ghost { background:#fff; color:var(--ink); -webkit-text-stroke:0; text-shadow:none; font-size:20px; padding:6px 20px 4px; transform:none; box-shadow:4px 4px 0 var(--ink); }
  .hint { font-size:13px; font-weight:700; line-height:1.5; margin-top:14px; max-width:540px; background:#fff; border:3px solid var(--ink); padding:8px 12px; box-shadow:4px 4px 0 var(--ink); }
  #maps { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin:12px 0; }
  #maps figure { margin:0; background:#fff; border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:6px; }
  #maps canvas { width:min(40vw,290px,54vh); height:auto; display:block; }
  #maps figcaption { font-size:12.5px; font-weight:800; margin-top:6px; }
  .fair { font-size:13.5px; font-weight:700; margin:4px 0 6px; background:#fff; border:3px solid var(--ink); padding:6px 12px; box-shadow:4px 4px 0 var(--ink); }
  .pad { position:fixed; z-index:5; width:156px; height:156px; display:none; touch-action:none; }
  .pad.on { display:block; }
  .pad div { position:absolute; width:52px; height:52px; border-radius:8px; background:#fff; border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--ink); }
  .pad div.down { background:var(--yel); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .pad .u { left:52px; top:0; } .pad .d { left:52px; top:104px; } .pad .l { left:0; top:52px; } .pad .r { left:104px; top:52px; }
  #pad1 { left:calc(12px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); }
  #pad2 { right:calc(12px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom)); }
  #quit { position:fixed; z-index:6; bottom:calc(10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:none;
    font:400 18px Bangers, sans-serif; letter-spacing:.06em; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:6px; padding:4px 14px 2px; box-shadow:3px 3px 0 var(--ink); }
  #quit.on { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="pad" id="pad1"><div class="u" data-d="0,-1">▲</div><div class="l" data-d="-1,0">◀</div><div class="r" data-d="1,0">▶</div><div class="d" data-d="0,1">▼</div></div>
<div class="pad" id="pad2"><div class="u" data-d="0,-1">▲</div><div class="l" data-d="-1,0">◀</div><div class="r" data-d="1,0">▶</div><div class="d" data-d="0,1">▼</div></div>
<button id="quit">Menu</button>

<div class="overlay" id="menu"><div class="inner">
<div class="titlewrap"><svg viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true"><polygon points="100,2 112,16 132,4 136,20 160,10 156,28 190,24 172,40 198,52 168,56 180,74 150,66 140,80 122,66 100,78 84,64 60,78 58,62 30,72 36,56 4,56 26,42 2,26 34,26 30,8 58,18 66,2 84,16" fill="#FF2E4C" stroke="#121018" stroke-width="3" stroke-linejoin="round"/></svg>
  <h1>Lanternmaze!</h1></div>
  <p class="sub">Duel in the dark</p>
  <div class="panel">
  <div class="lbl">Mode</div>
  <div class="row" data-group="mode"><button class="opt on" data-v="ai">Player vs AI</button><button class="opt" data-v="pvp">Player vs Player</button></div>
  <div class="lbl" id="p1lbl">Player 1 heroine</div>
  <div class="heroes" id="heroes"></div>
  <div class="lbl">Maze size</div>
  <div class="row" data-group="size"><button class="opt" data-v="8">Small</button><button class="opt on" data-v="11">Medium</button><button class="opt" data-v="15">Large</button></div>
  <div class="lbl ai-only">AI difficulty</div>
  <div class="row ai-only" data-group="ai"><button class="opt" data-v="easy">Easy</button><button class="opt on" data-v="normal">Normal</button><button class="opt" data-v="hard">Hard</button></div>
  <div class="lbl">Lantern</div>
  <div class="row" data-group="light"><button class="opt on" data-v="around">3×3 around you</button><button class="opt" data-v="ahead">3×3 ahead of you</button></div>
  <div class="lbl">Memory</div>
  <div class="row" data-group="trail"><button class="opt on" data-v="off">Pure darkness</button><button class="opt" data-v="on">Faint footprints</button></div>
  </div>
  <button class="btn" id="go">Light it up!</button>
  <p class="hint" id="hint"></p>
</div></div>

<div class="overlay hidden" id="end"><div class="inner">
  <div class="titlewrap"><svg viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true"><polygon points="100,2 112,16 132,4 136,20 160,10 156,28 190,24 172,40 198,52 168,56 180,74 150,66 140,80 122,66 100,78 84,64 60,78 58,62 30,72 36,56 4,56 26,42 2,26 34,26 30,8 58,18 66,2 84,16" fill="#00B7FF" stroke="#121018" stroke-width="3" stroke-linejoin="round"/></svg><h1 id="endTitle">Escaped!</h1></div>
  <p class="sub" id="endSub"></p>
  <div class="fair" id="fair"></div>
  <div id="maps"></div>
  <div class="row"><button class="btn" id="again">Rematch!</button></div>
  <div class="row"><button class="btn ghost" id="toMenu">Menu</button></div>
</div></div>

  c.width = c.height = Math.round(s * 2 * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#FFE9A8'; g.fillRect(0, 0, s * 2, s * 2);
  g.fillStyle = 'rgba(255,62,165,.45)';
  for (const [x, y] of [[s / 2, s / 2], [s * 1.5, s * 1.5]]) { g.beginPath(); g.arc(x, y, s * 0.24, 0, 6.3); g.fill(); }
  floorPat = ctx.createPattern(c, 'repeat'); floorPatTs = Math.round(ts);
  return floorPat;
}

// comic bursts
const bursts = [];
function addBurst(pl, text, color = YEL, size = 1) { bursts.push({ pl, text, color, size, t: 0, life: 1.1, x: pl ? pl.fx : 0, y: pl ? pl.fy : 0, rot: (Math.random() - 0.5) * 0.3 }); }
function starPath(x, y, rOut, rIn, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + (i * Math.PI) / n, r = i % 2 ? rIn * (0.85 + 0.15 * Math.sin(i * 7.3)) : rOut * (0.9 + 0.1 * Math.cos(i * 3.1));
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function drawBurst(x, y, text, color, scaleK, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scaleK, scaleK);
  ctx.font = `48px ${FONT}`;
  const tw = ctx.measureText(text).width, R = Math.max(54, tw * 0.72);
  ctx.fillStyle = INK; starPath(6, 6, R, R * 0.68, 14, 0.2); ctx.fill();
  ctx.fillStyle = color; starPath(0, 0, R, R * 0.68, 14, 0.2); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.strokeText(text, 0, 3);
  ctx.fillStyle = '#fff'; ctx.fillText(text, 0, 3);
  ctx.restore();
}

function drawView(pl, vx, vy, vw, vh) {
  ctx.save(); ctx.beginPath(); ctx.rect(vx, vy, vw, vh); ctx.clip();
  ctx.fillStyle = '#2C2878'; ctx.fillRect(vx, vy, vw, vh);
  const ts = Math.min(vw, vh) / 6.2, m = pl.maze;
  const cx = vx + vw / 2 - (pl.fx + 0.5) * ts, cy = vy + vh / 2 - (pl.fy + 0.5) * ts;
  const lit = new Set(litCells(pl).map(([x, y]) => y * m.W + x));
  const range = 5;
  const tiles = [];
  for (let y = Math.floor(pl.fy) - range; y <= Math.ceil(pl.fy) + range; y++) for (let x = Math.floor(pl.fx) - range; x <= Math.ceil(pl.fx) + range; x++) {
    if (x < 0 || y < 0 || x >= m.W || y >= m.W) continue;
    const i = y * m.W + x;
    if (lit.has(i) || (cfg.trail === 'on' && pl.seen[i])) tiles.push([x, y, i, lit.has(i)]);
  }
  // floors first, then walls, so wall faces overlap correctly
  for (const [x, y, i, on] of tiles) if (!m.t[i]) drawFloor(cx + x * ts, cy + y * ts, ts, on);
  for (const [x, y, i, on] of tiles) if (m.t[i]) drawWall(cx + x * ts, cy + y * ts, ts, on, x, y, m, pl.hero);
  for (const [x, y, i, on] of tiles) {
    if (x === m.start.x && y === m.start.y) { ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = '#3BE07A'; ctx.beginPath(); ctx.ellipse(cx + (x + 0.5) * ts, cy + (y + 0.82) * ts, ts * 0.3, ts * 0.1, 0, 0, 6.3); ctx.fill(); ctx.stroke(); }
    if (x === m.exit.x && y === m.exit.y && on) drawExit(cx + x * ts, cy + y * ts, ts);
  }
  if (cfg.trail === 'on') {
    ctx.fillStyle = pl.hero.accent; ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    for (const p of pl.trail) { const sx = cx + (p.x + 0.5) * ts, sy = cy + (p.y + 0.5) * ts; if (Math.abs(sx - vx - vw / 2) < vw && Math.abs(sy - vy - vh / 2) < vh && !(p.x === pl.x && p.y === pl.y)) { ctx.beginPath(); ctx.arc(sx, sy, ts * 0.06, 0, 6.3); ctx.fill(); ctx.stroke(); } }
  }
  drawHeroine(pl, cx + (pl.fx + 0.5) * ts, cy + (pl.fy + 0.85) * ts, ts);
  // halftone darkness centred on the lantern
  const lx = cx + (pl.fx + 0.5 + (cfg.light === 'ahead' ? pl.dir[0] : 0)) * ts, ly = cy + (pl.fy + 0.5 + (cfg.light === 'ahead' ? pl.dir[1] : 0)) * ts;
  const fieldC = darkField(vw, vh, ts);
  ctx.drawImage(fieldC, lx - vw, ly - vh, vw * 2, vh * 2);
  // bursts belonging to this player
  for (const b of bursts) if (b.pl === pl) {
    const k = Math.min(1, b.t / 0.12), pop = k < 1 ? 0.4 + 0.75 * k : 1 + 0.05 * Math.sin(b.t * 12);
    ctx.globalAlpha = b.t > b.life - 0.2 ? Math.max(0, (b.life - b.t) / 0.2) : 1;
    drawBurst(cx + (b.x + 0.5) * ts + ts * 0.9, cy + (b.y - 0.2) * ts - b.t * ts * 0.25, b.text, b.color, (ts / 150) * b.size * pop, b.rot);
    ctx.globalAlpha = 1;
  }
  // caption boxes
  ctx.font = `22px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const cap = `${pl.label} · ${pl.hero.name}`.toUpperCase(), cw = ctx.measureText(cap).width + 22;
  caption(vx + 12, vy + 12, cw, 34, pl.hero.panel, cap, '#fff');
  ctx.font = `800 14px Nunito, sans-serif`;
  const st = `${pl.steps} steps · ${fmt(pl.time)}`, sw = ctx.measureText(st).width + 20;
  caption(vx + vw - sw - 14, vy + 14, sw, 30, '#fff', st, INK, true);
  if (pl.done) {
    ctx.fillStyle = 'rgba(255,212,0,.35)'; ctx.fillRect(vx, vy, vw, vh);
    drawBurst(vx + vw / 2, vy + vh / 2, winner === pl ? 'ESCAPED!' : 'OUT TOO!', winner === pl ? YEL : CYAN, Math.min(vw, vh) / 300, -0.08);
  }
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.strokeRect(vx, vy, vw, vh);
}
function caption(x, y, w, h, bg, text, fg, small) {
  ctx.fillStyle = INK; ctx.fillRect(x + 4, y + 4, w, h);
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = fg;
  if (!small) { ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.strokeText(text, x + 11, y + h / 2 + 2); }
  ctx.fillText(text, x + (small ? 10 : 11), y + h / 2 + (small ? 1 : 2));
}
function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; }
function drawFloor(sx, sy, ts, on) {
  ctx.fillStyle = on ? floorPattern(ts) : '#5A4F9E';
  ctx.save(); ctx.translate(sx, sy); ctx.fillRect(0, 0, ts + 0.5, ts + 0.5); ctx.restore();
  ctx.strokeStyle = on ? INK : 'rgba(18,16,24,.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(sx + 1, sy + 1, ts - 2, ts - 2);
}
function drawWall(sx, sy, ts, on, x, y, m, hero) {
  const below = isFloor(m, x, y + 1), face = below ? ts * 0.34 : 0, topH = ts - face;
  const [c0, c1] = on ? hero.wall : ['#3B3590', '#2E2970'];
  ctx.fillStyle = c0; ctx.fillRect(sx, sy, ts + 0.5, topH + 0.5);
  if (on) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(sx + ts * 0.1, sy + ts * 0.1, ts * 0.35, ts * 0.07); ctx.fillRect(sx + ts * 0.1, sy + ts * 0.1, ts * 0.07, topH * 0.3); }
  if (below) {
    ctx.fillStyle = c1; ctx.fillRect(sx, sy + topH, ts + 0.5, face + 0.5);
    if (on) {
      ctx.save(); ctx.beginPath(); ctx.rect(sx, sy + topH, ts, face); ctx.clip();
      ctx.strokeStyle = 'rgba(18,16,24,.55)'; ctx.lineWidth = 2;
      for (let i = -face; i < ts + face; i += ts / 7) { ctx.beginPath(); ctx.moveTo(sx + i, sy + topH + face); ctx.lineTo(sx + i + face, sy + topH); ctx.stroke(); }
      ctx.restore();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx, sy + topH); ctx.lineTo(sx + ts, sy + topH); ctx.stroke();
  }
  ctx.strokeStyle = on ? INK : 'rgba(18,16,24,.5)'; ctx.lineWidth = 3; ctx.strokeRect(sx + 1.5, sy + 1.5, ts - 3, ts - 3);
}
function drawExit(sx, sy, ts) {
  const x = sx + ts / 2, y = sy + ts / 2, s = 1 + 0.06 * Math.sin(time * 6);
  ctx.save(); ctx.translate(x, y); ctx.rotate(time * 0.6); ctx.scale(s, s);
  ctx.fillStyle = INK; starPath(3, 3, ts * 0.52, ts * 0.3, 10, 0); ctx.fill();
  ctx.fillStyle = YEL; starPath(0, 0, ts * 0.52, ts * 0.3, 10, 0); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(ts * 0.26)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.strokeText('EXIT', x, y + 2); ctx.fillStyle = RED; ctx.fillText('EXIT', x, y + 2);
}
function drawHeroine(pl, x, y, ts) {
  const S = pl.hero.sheet, img = pl.hero.img;
  ctx.fillStyle = 'rgba(18,16,24,.45)'; ctx.beginPath(); ctx.ellipse(x, y, ts * 0.24, ts * 0.075, 0, 0, 6.3); ctx.fill();
  if (!img.complete) return;
  const h = ts * 1.15, k = h / S.standH;
  const frame = pl.to ? Math.floor(pl.anim * 9) % 5 : 0;
  ctx.save(); ctx.translate(x, y);
  if (pl.to) ctx.translate(0, -Math.abs(Math.sin(pl.anim * 18)) * ts * 0.03);
  ctx.scale(pl.face > 0 ? 1 : -1, 1);
  ctx.drawImage(img, frame * S.cw, 0, S.cw, S.ch, -S.ax * k, -S.base * k, S.cw * k, S.ch * k);
  ctx.restore();
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  if (state === 'menu' || !players.length) return;
  // paper with faint halftone
  ctx.fillStyle = 'rgba(255,62,165,.12)';
  for (let y = 0; y < H; y += 12) for (let x = (y / 12) % 2 ? 6 : 0; x < W; x += 12) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.3); ctx.fill(); }
  const side = W >= H, gut = 12;
  if (side) { drawView(players[0], gut, gut, W / 2 - gut * 1.5, H - gut * 2); drawView(players[1], W / 2 + gut / 2, gut, W / 2 - gut * 1.5, H - gut * 2); }
  else { drawView(players[0], gut, gut, W - gut * 2, H / 2 - gut * 1.5); drawView(players[1], gut, H / 2 + gut / 2, W - gut * 2, H / 2 - gut * 1.5); }
  if (countdown > 0 || goFlash > 0) {
    const n = Math.ceil(countdown), txt = countdown > 0 ? n + '!' : 'GO!';
    const ph = countdown > 0 ? 1 - (countdown - Math.floor(countdown)) : 1 - goFlash / 0.7;
    const k = Math.min(1, ph / 0.15);
    drawBurst(W / 2, H / 2 - 10, txt, countdown > 0 ? [RED, CYAN, MAG][n % 3] : YEL, (Math.min(W, H) / 260) * (0.5 + 0.5 * k), -0.06);
    if (countdown > 0) {
      const st = pairInfo.A.st, t1 = 'TWIN MAZES!', t2 = `${st.len * 2} steps out · ${st.dead} dead ends · ${st.forks} junctions`;
      ctx.font = `800 14px Nunito, sans-serif`; const w2 = Math.min(W - 30, ctx.measureText(t2).width + 24);
      ctx.textAlign = 'left';
      ctx.font = `22px ${FONT}`; const w1 = ctx.measureText(t1).width + 22;
      caption(W / 2 - w1 / 2, H / 2 + Math.min(W, H) * 0.22, w1, 34, YEL, t1, '#fff');
      ctx.font = `800 14px Nunito, sans-serif`;
      caption(W / 2 - w2 / 2, H / 2 + Math.min(W, H) * 0.22 + 42, w2, 30, '#fff', t2, INK, true);
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (state === 'play') {
    if (countdown > 0) { const before = Math.ceil(countdown); countdown -= dt; if (Math.ceil(countdown) !== before && countdown > 0) tone(440, 0.08, 'square', 0.03); if (countdown <= 0) { tone(880, 0.15, 'square', 0.04); goFlash = 0.7; } }
    else { goFlash = Math.max(0, goFlash - dt); for (const pl of players) stepPlayer(pl, dt); }
    for (const b of bursts) b.t += dt; for (let i = bursts.length - 1; i >= 0; i--) if (bursts[i].t > bursts[i].life) bursts.splice(i, 1);
  }
  render();
  requestAnimationFrame(loop);
}
resize();
if (document.fonts && document.fonts.load) document.fonts.load(`40px ${FONT}`).catch(() => {});
window.__m = { get players() { return players; }, get pair() { return pairInfo; }, start: startGame, cfg, makeFairPair };
requestAnimationFrame(loop);
})();
</script>
